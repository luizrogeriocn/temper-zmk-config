name: draw keymap

on:
  workflow_dispatch:  # can be triggered manually
  push:               # automatically run on changes to following paths
    paths:
      - ".github/workflows/doc.yml"
      - "keymap_img/keymap_drawer.config.yaml"
      - "scripts/generate_keymap_svg.sh"
      - "scripts/merge_keymap_svgs.py"
      - "config/*.keymap"
      - "config/*.dtsi"
      - "boards/*/*/*.keymap"
      - "boards/*/*/*.dtsi"

jobs:
  draw:
    permissions:
      contents: write  # allow workflow to commit to the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install keymap-drawer
        run: pip install keymap-drawer==0.23.0

      - name: Regenerate keymap image
        run: bash scripts/generate_keymap_svg.sh

      - name: Commit updated keymap image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap_img/temper.yaml keymap_img/temper.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "doc: update keymap image"
          git push
