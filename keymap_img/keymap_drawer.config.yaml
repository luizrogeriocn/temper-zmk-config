draw_config:
  append_colon_to_layer_header: true
  arc_radius: 6.0
  arc_scale: 1.0
  combo_h: 26.0
  combo_w: 28.0
  dark_mode: true
  draw_key_sides: false
  inner_pad_h: 2.0
  inner_pad_w: 2.0
  key_h: 56.0
  key_rx: 6.0
  key_ry: 6.0
  key_w: 60.0
  line_spacing: 1.2
  outer_pad_h: 56.0
  outer_pad_w: 30.0
  small_pad: 2.0
  split_gap: 30.0
  svg_style: |
    /* font and background color specifications */
    svg {
        font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
        font-size: 14px;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
        fill: #e6edf3;
        background: #0d1117;
    }

    /* default key styling */
    rect {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1;
    }

    /* default key side styling, only used if draw_key_sides is set */
    rect.side {
        fill: #0f141b;
    }

    /* color accent for combo boxes */
    rect.combo {
        fill: #16324f;
    }

    /* color accent for held keys */
    rect.held, rect.combo.held {
        fill: #4a1d24;
    }

    /* color accent for ghost (optional) keys */
    rect.ghost, rect.combo.ghost {
        fill: #21262d;
    }

    text {
        text-anchor: middle;
        dominant-baseline: middle;
    }

    /* styling for layer labels */
    text.label {
        font-weight: bold;
        text-anchor: start;
        stroke: #0d1117;
        stroke-width: 2;
        paint-order: stroke;
    }

    /* styling for combo tap, and key hold/shifted label text */
    text.combo, text.hold, text.shifted {
        font-size: 11px;
    }

    text.hold {
        text-anchor: middle;
        dominant-baseline: text-after-edge;
        font-size: 12px;
        font-weight: 600;
        fill: #9da7b3;
    }

    text.shifted {
        text-anchor: middle;
        dominant-baseline: hanging;
    }

    /* styling for hold/shifted label text in combo box */
    text.combo.hold, text.combo.shifted {
        font-size: 8px;
    }

    /* styling for combo dendrons */
    path:not(.glyph-icon) {
        stroke-width: 1;
        stroke: #8b949e;
        fill: none;
    }
