layout: {zmk_keyboard: temper}
layers:
  default_layer:
  - - Q
    - W
    - F
    - P
    - B
    - J
    - L
    - U
    - Y
    - {t: '''', s: '"'}
  - - {t: A, h: ⌃}
    - {t: R, h: ⎇}
    - {t: S, h: ⌘}
    - {t: T, h: ⇧}
    - G
    - M
    - {t: N, h: ⇧}
    - {t: E, h: ⌘}
    - {t: I, h: ⎇}
    - {t: O, h: ⌃}
  - - Z
    - X
    - C
    - D
    - V
    - K
    - H
    - {t: ',', s: ;}
    - {t: ., s: ':'}
    - {t: '?', s: '!'}
  - - ⌘
    - fun_layer
    - SPACE
    - {t: ⇧, s: ⇪}
    - num_nav_layer
    - ⌃
  num_nav_layer:
  - - PG UP
    - HOME
    - UP ARROW
    - END
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - '7'
    - '8'
    - '9'
    - {t: ▽, type: trans}
  - - PG DN
    - ←
    - DOWN ARROW
    - →
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - '4'
    - '5'
    - '6'
    - '0'
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - '1'
    - '2'
    - '3'
    - {t: ▽, type: trans}
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
  fun_layer:
  - - PRINTSCREEN
    - MUTE
    - VOL DN
    - VOL UP
    - OUT USB
    - {t: ▽, type: trans}
    - F9
    - F10
    - F11
    - F12
  - - {t: BT, h: '0'}
    - {t: BT, h: '1'}
    - {t: BT, h: '2'}
    - {t: BT, h: '3'}
    - {t: BT, h: '4'}
    - {t: ▽, type: trans}
    - F5
    - F6
    - F7
    - F8
  - - BT CLR
    - PREV
    - PP
    - NEXT
    - OUT BLE
    - {t: ▽, type: trans}
    - F1
    - F2
    - F3
    - F4
  - - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  game_layer:
  - - ↹
    - Q
    - W
    - E
    - R
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - ⇧
    - A
    - S
    - D
    - F
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - ⌃
    - Z
    - X
    - C
    - V
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - ESC
    - {type: held}
    - SPACE
    - {t: ▽, type: trans}
    - {type: held}
    - {t: default_layer, h: toggle}
combos:
- p: [0, 10]
  k: '~'
  l: [default_layer]
- p: [11, 1]
  k: '@'
  l: [default_layer]
- p: [12, 2]
  k: '#'
  l: [default_layer]
- p: [13, 3]
  k: $
  l: [default_layer]
- p: [10, 20]
  k: '%'
  l: [default_layer]
- p: [11, 21]
  k: ^
  l: [default_layer]
- p: [22, 12]
  k: {t: '&', s: '|'}
  l: [default_layer]
- p: [13, 23]
  k: '*'
  l: [default_layer]
- p: [14, 4]
  k: '['
  l: [default_layer]
- p: [24, 14]
  k: (
  l: [default_layer]
- p: [15, 5]
  k: ']'
  l: [default_layer]
- p: [25, 15]
  k: )
  l: [default_layer]
- p: [19, 9]
  k: {t: '`', s: '~'}
  l: [default_layer]
- p: [26, 16]
  k: <
  l: [default_layer]
- p: [28, 18]
  k: '>'
  l: [default_layer]
- p: [29, 19]
  k: {t: /, s: \}
  l: [default_layer]
- p: [16, 6]
  k: {t: '-', s: _}
  l: [default_layer]
- p: [17, 7]
  k: _
  l: [default_layer]
- p: [27, 17]
  k: {t: '=', s: +}
  l: [default_layer]
- p: [18, 8]
  k: +
  l: [default_layer]
- p: [20, 21]
  k: ⎋
  l: [default_layer]
- p: [21, 22]
  k: ↹
  l: [default_layer]
- p: [26, 27]
  k: ENTER
  l: [default_layer]
- p: [28, 27]
  k: BACKSPACE
  l: [default_layer]
