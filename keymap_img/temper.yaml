layout: {zmk_keyboard: temper}
layers:
  default_layer:
  - - Q
    - W
    - F
    - P
    - B
    - J
    - L
    - U
    - Y
    - {t: '''', s: '"'}
  - - {t: A, h: ⌃}
    - {t: R, h: ⎇}
    - {t: S, h: ⌘}
    - {t: T, h: ⇧}
    - G
    - M
    - {t: N, h: ⇧}
    - {t: E, h: ⌘}
    - {t: I, h: ⎇}
    - {t: O, h: ⌃}
  - - Z
    - X
    - C
    - D
    - V
    - K
    - H
    - {t: ',', s: ;}
    - {t: ., s: ':'}
    - {t: '?', s: '!'}
  - - ⎋
    - ⎵
    - ⌘
    - {t: ⇧, s: ⇪}
    - num_nav_layer
    - fun_layer
  num_nav_layer:
  - - PG UP
    - HOME
    - ↑
    - END
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - '7'
    - '8'
    - '9'
    - {t: ▽, type: trans}
  - - {t: PG DN, h: ⌃}
    - {t: ←, h: ⎇}
    - {t: ↓, h: ⌘}
    - {t: →, h: ⇧}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: '4', h: ⇧}
    - {t: '5', h: ⌘}
    - {t: '6', h: ⎇}
    - {t: '0', h: ⌃}
  - - ⎋
    - ↹
    - ⏎
    - {t: ⌫, s: ⌦}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - '1'
    - '2'
    - '3'
    - {t: ▽, type: trans}
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
  fun_layer:
  - - PRINTSCREEN
    - MUTE
    - VOL DN
    - VOL UP
    - OUT USB
    - {t: game_layer, h: toggle}
    - F9
    - F10
    - F11
    - F12
  - - {t: BT, h: '0'}
    - {t: BT, h: '1'}
    - {t: BT, h: '2'}
    - {t: BT, h: '3'}
    - {t: BT, h: '4'}
    - {t: default_layer, h: toggle}
    - F5
    - F6
    - F7
    - F8
  - - BT CLR
    - ⏮
    - ⏯
    - ⏭
    - OUT BLE
    - {t: qwerty_layer, h: toggle}
    - F1
    - F2
    - F3
    - F4
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
  game_layer:
  - - ↹
    - Q
    - W
    - E
    - R
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - ⇧
    - A
    - S
    - D
    - F
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - ⌃
    - Z
    - X
    - C
    - V
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - ESC
    - {t: ▽, type: trans}
    - ⎵
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: default_layer, h: toggle}
  qwerty_layer:
  - [Q, W, E, R, T, Y, U, I, O, P]
  - - {t: A, h: ⌃}
    - {t: S, h: ⎇}
    - {t: D, h: ⌘}
    - {t: F, h: ⇧}
    - G
    - H
    - {t: J, h: ⇧}
    - {t: K, h: ⌘}
    - {t: L, h: ⎇}
    - {t: '''', h: ⌃, s: '"'}
  - - Z
    - X
    - C
    - V
    - B
    - N
    - M
    - {t: ',', s: ;}
    - {t: ., s: ':'}
    - {t: '?', s: '!'}
  - - ⎋
    - ⎵
    - {t: default_layer, h: toggle}
    - {t: ⇧, s: ⇪}
    - num_nav_layer
    - fun_layer
combos:
- p: [0, 10]
  k: '~'
  l: [default_layer, qwerty_layer]
- p: [11, 1]
  k: '@'
  l: [default_layer, qwerty_layer]
- p: [12, 2]
  k: '#'
  l: [default_layer, qwerty_layer]
- p: [13, 3]
  k: $
  l: [default_layer, qwerty_layer]
- p: [10, 20]
  k: '%'
  l: [default_layer, qwerty_layer]
  a: bottom
  o: 0.15
- p: [11, 21]
  k: ^
  l: [default_layer, qwerty_layer]
  a: bottom
  o: 0.15
- p: [22, 12]
  k: {t: '&', s: '|'}
  l: [default_layer, qwerty_layer]
  a: bottom
  o: 0.15
- p: [13, 23]
  k: '*'
  l: [default_layer, qwerty_layer]
  a: bottom
  o: 0.15
- p: [14, 4]
  k: '['
  l: [default_layer, qwerty_layer]
- p: [24, 14]
  k: (
  l: [default_layer, qwerty_layer]
  a: bottom
  o: 0.15
- p: [15, 5]
  k: ']'
  l: [default_layer, qwerty_layer]
- p: [25, 15]
  k: )
  l: [default_layer, qwerty_layer]
  a: bottom
  o: 0.15
- p: [19, 29]
  k: {t: '`', s: '~'}
  l: [default_layer, qwerty_layer]
  a: bottom
  o: 0.15
- p: [26, 16]
  k: <
  l: [default_layer, qwerty_layer]
  a: bottom
  o: 0.15
- p: [28, 18]
  k: '>'
  l: [default_layer, qwerty_layer]
  a: bottom
  o: 0.15
- p: [8, 18]
  k: {t: /, s: \}
  l: [default_layer, qwerty_layer]
- p: [16, 6]
  k: {t: '-', s: _}
  l: [default_layer, qwerty_layer]
- p: [17, 7]
  k: _
  l: [default_layer, qwerty_layer]
- p: [27, 17]
  k: {t: '=', s: +}
  l: [default_layer, qwerty_layer]
- p: [9, 19]
  k: +
  l: [default_layer, qwerty_layer]
- p: [21, 22]
  k: ↹
  l: [default_layer, qwerty_layer]
  a: bottom
  o: 0.15
- p: [27, 26]
  k: ⏎
  l: [default_layer, qwerty_layer]
- p: [28, 27]
  k: {t: ⌫, s: ⌦}
  l: [default_layer, qwerty_layer]
